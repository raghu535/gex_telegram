  drop_window_min: 60
  separation_min: 60
  lead_min: 60
  output_dir: reports

gamma_snap:
  enabled: true
  # LONG tiers: neg gamma + price falling (rubber band)
  long_t1_gamma_bn: -5      # T1: 65% win, 9.0 R:R
  long_t1_px_fall: 15
  long_t2_gamma_bn: -5      # T2: 56% win, 5.5 R:R
  long_t2_px_fall: 10
  long_t3_gamma_bn: -10     # T3: 47% win, 4.4 R:R
  long_t3_px_fall: 5
  long_t4_gamma_bn: -15     # T4: 36% win, 2.4 R:R (extreme gamma alone)
  # SHORT S1: fake rally (price up but gamma falling)
  short_px_rise_15m: 10     # S1: 76% win
  short_dg_fall_15m: -1
  # SHORT S2: gamma ceiling (rally into strong positive gamma)
  short_s2_px_rise_20m: 15  # S2: 100% reversal when G>+10Bn, avg -28pts/30m
  short_s2_gamma_bn: 10
  # LIQUIDITY SWEEPS: price breaks 1hr high/low then reverses
  sweep_gamma_bn: 5         # L1: G<-5 for low sweep, S3: G>+5 for high sweep
  # SHORT S4/S5/S6: DISABLED for Telegram (audit: not reliable for real money)
  # Kept in Discord/replay only for observation. Will be replaced by level-based alerts.
  s4_enabled: false         # S4: NEG_GAMMA_FADE — 0 signals or false signals
  s4_rally_pts: 15
  s4_gamma_bn: -2
  s5_enabled: false         # S5: WALL_COLLAPSE — fires too much on flickering spreads
  s5_spread_threshold: 5
  s5_prior_spread_min: 10
  s6_enabled: false         # S6: GAMMA_ACCEL — 50/50, fires at exhaustion
  s6_dg_threshold: -2
  s6_gamma_floor: -4

telegram_alerts:
  enabled: false
  bot_token_env: TELEGRAM_BOT_TOKEN  # read from .env
  cooldowns:
    bounce_zone: 900      # 15min (vs 5min for Discord) — reduces noise
    regime_shift: 600     # 10min
    wall_breach: 300      # 5min
    gamma_squeeze: 300    # 5min
    rth_pulse: 300        # 5min — market status
    micro_pulse: 300      # 5min — quick moves
    trend_dashboard: 300  # 5min — trend updates
    quiet_summary: 600    # 10min
    hourly_recap: 3600    # 1hr
    overnight_drift: 1800 # 30min
    morning_checklist: 86400  # once per day
    final_15: 86400           # once per day
    gap_alert: 86400          # once per day
    gamma_snap: 900           # 15min (default for T3/S1)
    market_consensus: 900    # 15min
    "gamma_snap:LONG_T1": 900 # 15min — gives 3-4 alerts over a multi-hour T1 event
    "gamma_snap:LONG_T1_LATE": 300  # 5min — late session T1, 0DTE amplified, more urgent
    "gamma_snap:SHORT_S2": 900 # 15min — gamma ceiling reversal
    "gamma_snap:LONG_L1": 900  # 15min — liquidity sweep low grab
    "gamma_snap:SHORT_S3": 900 # 15min — liquidity sweep high grab
    "gamma_snap:SHORT_S4": 900 # 15min — neg gamma rally fade
    "gamma_snap:SHORT_S5": 900 # 15min — wall collapse
    "gamma_snap:SHORT_S6": 900 # 15min — gamma acceleration
    "gamma_snap:LONG_B1": 86400  # once per day — early rally
    "gamma_snap:SHORT_BEAR": 86400  # once per day — early selloff
    "gamma_snap:BUTTERFLY_PIN_STANDARD": 86400  # once per day — butterfly pin
    "gamma_snap:BUTTERFLY_PIN_HIGH": 86400      # once per day — high confidence pin
    level_approach: 1800      # 30min per level — anticipation alert
    spx_million: 300          # 5min — Arabic channel trade calls
    ma_snap: 86400            # once per day per side
    "ma_snap:LONG": 86400     # once per day — rubber band
    "ma_snap:SHORT": 86400    # once per day — dead cat fade
    lotto: 86400              # once per day — lotto short
    pin_forecast: 86400       # once per day — close nowcast
    data_lag: 300             # 5min
    conviction_signal: 600    # 10min — cross-system conviction
    data_restored: 0          # immediate
    morning_brief: 86400      # once per day
    morning_read: 86400       # once per day
    morning_bet: 86400        # once per day
    em_fade: 3600             # 1hr
    pin_trade: 86400          # once per day
