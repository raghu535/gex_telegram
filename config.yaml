alerts:
  # full: all alerts; deep_context: suppress intraday noise, keep context/scheduled intel
  mode: full

sessions:
  rth:
    start: "06:30"
    end: "13:00"
  transition:
    start: "13:00"
    end: "13:15"
  next_day_preview:
    start: "13:15"
    end: "04:00"
  premarket:
    start: "04:00"
    end: "06:30"

regime:
  strong_gamma_bn: 8.0
  moderate_gamma_bn: 4.0
  flat_slope_range: 1.0
  negative_slope_threshold: -3.0
  severe_slope_threshold: -5.0
  pin_range_pts: 15.0
  flip_warning_pct: 20.0
  decay_pct_threshold: 25.0
  # Debounce: must see N consecutive snapshots agreeing before confirming a shift
  hold_count: 3

analysis:
  fifteen_min_window: 15
  one_hour_window: 60
  regime_compute_interval: 5
  overnight_drift_interval: 30
  bounce_zone_pts: 15.0
  wall_convergence_pct: 10.0
  min_rr_ratio: 1.5
  gamma_acceleration_threshold: 2.0
  # Noise filters
  min_spread_pts: 20          # Walls meaningless below this spread
  wall_breach_buffer_pts: 5   # Price must exceed wall by this much
  min_pivot_gamma_bn: 0.5     # Ignore pivot strikes with tiny gamma

trend:
  # Intraday trend dashboard + early flip detection
  windows:
    - minutes: 5
      price_pts: 6
      gamma_bn: 0.4
      weight: 1
      gamma_only_weight: 0
      min_snaps: 2
    - minutes: 15
      price_pts: 12
      gamma_bn: 0.8
      weight: 2
      gamma_only_weight: 1
      min_snaps: 2
    - minutes: 30
      price_pts: 20
      gamma_bn: 1.5
      weight: 2
      gamma_only_weight: 1
      min_snaps: 2
    - minutes: 60
      price_pts: 35
      gamma_bn: 2.5
      weight: 3
      gamma_only_weight: 2
      min_snaps: 3
  score_threshold: 6
  smell_threshold: 2
  overnight_weight: 1
  overnight_pct: 15
  floor_pressure_pts: 12
  ceiling_pressure_pts: 12
  decay_pct: 25
  decay_weight: 2
  structural_weight: 1
  heartbeat_secs: 300
  min_emit_score: 6
  # Gamma regime override — absolute gamma level is directional
  regime_override_bn: 15.0      # |gamma| > 15Bn = strong structural bias
  regime_override_weight: 3     # Weight for strong regime override
  moderate_regime_bn: 8.0       # |gamma| > 8Bn = moderate structural bias
  moderate_regime_weight: 1     # Weight for moderate regime
  # Price-from-open reality check — realized moves are evidence
  move_from_open_pts: 20.0      # Move > 20pts from open = directional evidence
  move_from_open_weight: 2      # Weight for move-from-open

day_profile:
  # Classify early session profile for trend-noise gating.
  compute_interval_seconds: 60
  open_negative_bn: -4.0
  early_crash_bn: -9.0
  open_positive_bn: 5.0
  early_not_too_negative_bn: -5.0

counter_trend_gates:
  # move_from_open (pts) : min_score required for counter-trend alert
  # Counter-trend = bullish while below open, or bearish while above open.
  gates:
    - move_pts: 20
      min_score: 6
    - move_pts: 40
      min_score: 7
    - move_pts: 60
      min_score: 8
  # Above this move, suppress all counter-trend alerts regardless of score.
  suppress_all_pts: 60

advanced:
  gci_hard_wall_pct: 40.0
  gci_diffuse_pct: 25.0
  asymmetry_call_dominant: 2.0
  asymmetry_put_dominant: 1.0
  squeeze_velocity_weight: 0.3
  squeeze_proximity_weight: 0.3
  squeeze_concentration_weight: 0.2
  squeeze_asymmetry_weight: 0.2
  pin_distance_weight: 0.3
  pin_gamma_weight: 0.3
  pin_time_weight: 0.2
  pin_concentration_weight: 0.2

cooldowns:
  regime_shift: 300
  wall_breach: 180
  gamma_squeeze: 120
  bounce_zone: 300
  gamma_compression: 600
  strike_flip: 300
  overnight_drift: 1800
